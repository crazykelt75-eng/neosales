name: Deploy NeoSales to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npm run type-check

      - name: Build Static Export
        run: npm run build
        env:
          NEXT_PUBLIC_STORE_NAME: ${{ vars.NEXT_PUBLIC_STORE_NAME || 'NeoSales' }}
          NEXT_PUBLIC_SELLER_WHATSAPP: ${{ vars.NEXT_PUBLIC_SELLER_WHATSAPP || '+26771550200' }}
          NEXT_PUBLIC_ORANGE_MONEY_NUMBER: ${{ vars.NEXT_PUBLIC_ORANGE_MONEY_NUMBER || '74453342' }}
          NEXT_PUBLIC_FNB_PAY2CELL_NUMBER: ${{ vars.NEXT_PUBLIC_FNB_PAY2CELL_NUMBER || '71550200' }}
          NEXT_PUBLIC_FNB_ACCOUNT_NAME: ${{ vars.NEXT_PUBLIC_FNB_ACCOUNT_NAME || 'NeoSales Retail' }}
          NEXT_PUBLIC_ADMIN_PIN: ${{ vars.NEXT_PUBLIC_ADMIN_PIN || '2670' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://neosales.crazykelt75.workers.dev' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=neosales
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
